# Conda environment with everything ORFquant needs: R 4.5, Bioconductor 3.22,
# the packages in DESCRIPTION's Imports and Suggests, those of RiboseQC (which
# ORFquant imports), and pandoc for the HTML report. ORFquant itself is
# installed from GitHub, and so is RiboseQC (the Remotes field of DESCRIPTION;
# see README.md):
#
#   conda env create -f environment.yml
#   conda activate orfquant
#   Rscript -e 'remotes::install_github("katarinagresova/ORFquant", upgrade = "never")'
name: orfquant
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.5
  - bioconductor-biocversion=3.22

  # Depends and Imports
  - bioconductor-biocgenerics
  - bioconductor-biostrings
  - bioconductor-bsgenome
  - r-cowplot
  - bioconductor-genomicalignments
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - r-ggplot2
  - r-gridextra
  - bioconductor-iranges
  - r-multitaper
  - r-reshape2
  - bioconductor-rtracklayer
  - bioconductor-s4vectors
  - bioconductor-seqinfo
  - bioconductor-summarizedexperiment

  # Imports of RiboseQC, which ORFquant imports (bioconductor-annotationdbi and
  # bioconductor-txdbmaker are for the annotation step, bioconductor-cigarillo
  # and bioconductor-rsamtools for prepare_for_ORFquant(); knitr, rmarkdown and
  # bioconductor-rsamtools are also in the Suggests of ORFquant)
  - bioconductor-annotationdbi
  - bioconductor-txdbmaker
  - bioconductor-cigarillo
  - bioconductor-rsamtools
  - r-dt
  - r-ggpubr
  - r-scales
  - r-viridis
  - r-withr

  # Suggests: plot_orfquant_locus() and create_ORFquant_html_report()
  - r-dplyr
  - bioconductor-genomeinfodb
  - bioconductor-gviz
  - r-knitr
  - r-lemon
  - r-rmarkdown
  - pandoc

  # To install ORFquant from GitHub
  - r-remotes
